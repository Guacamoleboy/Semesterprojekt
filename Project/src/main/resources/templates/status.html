<!DOCTYPE html>
<html lang="da">
<head>

    <!-- Meta -->
    <meta charset="UTF-8"> <!-- ÆØÅ -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- In case some nerd uses Internet Explorer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile Responsiveness -->
    <meta name="description" content="Beregn prisen på din carport i dag på få minutter"> <!-- SEO / Google -->
    <meta name="author" content="Guacamoleboy"> <!-- Author of Website -->

    <!-- Visuals -->
    <title>Fog - Status</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Lato:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Work+Sans:wght@400;700&family=Exo+2:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="icon" href="/images/logo/fog.svg" type="image/x-icon">
    <link rel="apple-touch-icon" href="/images/logo/fog.svg">

    <!-- CSS Load -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Script Load -->
    <script src="/js/notification.js" defer></script>
    <script src="/js/status/status-display.js" defer></script>

    <!-- Framwork load -->
    <link rel="stylesheet" href="/css/guacamoleboy-wow.css">
    <link rel="stylesheet" href="/css/guacamoleboy-framework.css">
    <script src="/js/guacamoleboy-wow.js" defer></script>

    <!-- Font Awesome Load -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Modules -->
    <script type="module" src="/js/components/navbar2.js" defer></script>

</head>
<body>

<!-- Navbar -->
<div id="navbar2-component" data-backlink="/status"></div>
<!-- Navbar -->

<!-- Status Page -->
<section class="status-section">
    <div class="guac-container">

        <!-- Icons Row -->
        <div class="guac-row guac-justify-center guac-align-center guac-gap-3">

            <!-- Pending -->
            <div class="guac-col-3 guac-d-flex guac-flex-column guac-align-center status-line" id="status-step-1">
                <div class="status-circle guac-d-flex guac-align-center guac-justify-center">
                    <i class="fa fa-envelope-o"></i>
                </div>
            </div>

            <!-- Calculating -->
            <div class="guac-col-3 guac-d-flex guac-flex-column guac-align-center guac-locked" id="status-step-2">
                <div class="status-circle guac-d-flex guac-align-center guac-justify-center">
                    <i class="fa fa-calculator"></i>
                </div>
            </div>

            <!-- Offer Received -->
            <div class="guac-col-3 guac-d-flex guac-flex-column guac-align-center guac-locked" id="status-step-3">
                <div class="status-circle guac-d-flex guac-align-center guac-justify-center">
                    <i class="fa fa-check"></i>
                </div>
            </div>
        </div>

        <!-- Info -->
        <div class="guac-row guac-justify-center guac-mt-4">
            <div class="guac-col-9">
                <div class="status-info-card">
                    <h2 id="status-title">Mail afsendt til os</h2>
                    <p id="status-text">
                        Din mail er blevet afsendt og afventer at blive kigget på af en medarbejder.
                        Vi forsøger så vidt som muligt at svare tilbage inden 24 timer.
                        <br><br>Følg status her på siden.
                    </p>
                    <div id="status-action-buttons" class="status-action-buttons" style="display: none;">
                        <button type="button" class="guac-btn status-btn-accept" id="status-accept-btn">
                            Godkend tilbud
                        </button>
                        <button type="button" class="guac-btn status-btn-decline" id="status-decline-btn">
                            Afslå tilbud
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Status Page -->

<!-- Notifications -->
<div id="guac-notification-container"></div>
<!-- Notifications -->

</body>
</html>
