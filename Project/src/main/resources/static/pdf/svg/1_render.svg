<svg class="svg-render" width="855" height="690" viewBox="0 0 855 690"
     preserveAspectRatio="xMinYMin" xmlns="http://www.w3.org/2000/svg"
     stroke="#000000" fill="none">

    <defs>
        <marker id="beginArrow" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" fill="#000000">
            <path d="M0,6 L12,0 L12,12 L0,6" />
        </marker>
        <marker id="endArrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto" fill="#000000">
            <path d="M0,0 L12,6 L0,12 L0,0 " />
        </marker>
    </defs>

    <!-- Pile -->
    <line class="arrow-visuals" x1="40" y1="10" x2="40" y2="610"
          stroke="#000000" marker-start="url(#beginArrow)" marker-end="url(#endArrow)" />

    <line class="arrow-visuals" x1="75" y1="650" x2="780" y2="650"
          stroke="#000000" marker-start="url(#beginArrow)" marker-end="url(#endArrow)" />

    <!-- Text -->
    <text style="text-anchor: middle" transform="translate(30,300) rotate(-90)">600 cm</text>
    <text style="text-anchor: middle" x="390" y="670">780 cm</text>

    <svg x="75" y="10" width="780" height="600" viewBox="0 0 830 650" preserveAspectRatio="xMinYMin">

        <!-- Ramme -->
        <rect x="0" y="0" height="780" width="600" stroke="#000000" fill="none" />

        <!-- Remme -->
        <rect x="0" y="35" height="4.5" width="780" stroke="#000000" fill="none" />
        <rect x="0" y="565" height="4.5" width="780" stroke="#000000" fill="none" />

        <!-- Spær -->
        <rect x="0.0" y="0" width="4.5" height="600" />
<rect x="55.0" y="0" width="4.5" height="600" />
<rect x="110.0" y="0" width="4.5" height="600" />
<rect x="165.0" y="0" width="4.5" height="600" />
<rect x="220.0" y="0" width="4.5" height="600" />
<rect x="275.0" y="0" width="4.5" height="600" />
<rect x="330.0" y="0" width="4.5" height="600" />
