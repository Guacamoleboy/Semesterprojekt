<rect x="440.0" y="0" width="4.5" height="600" />
<rect x="495.0" y="0" width="4.5" height="600" />
<rect x="550.0" y="0" width="4.5" height="600" />
<rect x="605.0" y="0" width="4.5" height="600" />
<rect x="660.0" y="0" width="4.5" height="600" />
<rect x="715.0" y="0" width="4.5" height="600" />
<rect x="775.5" y="0" width="4.5" height="600" />


        <!-- Last Rafter -->
        <rect x="775.5" y="0" height="600" width="4.5" stroke="#000000" fill="none" />

        <!-- Kryds -->
        <line class="svg-cross" x1="55" y1="35" x2="600" y2="569.5" stroke="#000000" stroke-dasharray="5,5"/>
        <line class="svg-cross" x1="55" y1="569.5" x2="600" y2="35" stroke="#000000" stroke-dasharray="5,5"/>

        <!-- Stolper -->
        <rect x="0" y="32" width="10" height="10" />
<rect x="0" y="562" width="10" height="10" />
<rect x="310" y="32" width="10" height="10" />
<rect x="310" y="562" width="10" height="10" />
